# Alembic configuration — MONI AI.
#
# The database URL is intentionally NOT set here: db/migrations/env.py reads it from
# the application settings (DATABASE_URL), so this file never contains a credential
# (CLAUDE.md §3.11) and the migration service cannot disagree with the app about the
# target database.
#
# From the repository root (needs .env, or an exported DATABASE_URL):
#   uv run alembic -c db/alembic.ini current          # applied revision
#   uv run alembic -c db/alembic.ini history          # revision graph
#   uv run alembic -c db/alembic.ini upgrade head     # apply migrations
#   uv run alembic -c db/alembic.ini downgrade -1     # revert the last migration
#   uv run alembic -c db/alembic.ini revision -m "message"            # new revision
#   uv run alembic -c db/alembic.ini revision --autogenerate -m "…"   # from models
#
# In the dev stack migrations are applied by the one-shot `migrate` compose service;
# the gateway never touches the schema at startup.

[alembic]
# Migration scripts live in db/migrations/; db/migrations/versions/ holds the
# revisions. The audit_log table is defined once, in moni_gateway/audit.py, and
# imported by env.py as target_metadata.
script_location = db/migrations

# Makes the repository root importable, so `moni_gateway` resolves when the package
# is installed (container) or on the path (local run).
prepend_sys_path = .

# Required for platform-independent revision down_revision handling.
path_separator = os

# Timestamped, ordered revision filenames: YYYYMMDD_HHMM_<rev>_<slug>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone used for the timestamps above.
timezone = UTC

# sqlalchemy.url is deliberately absent: env.py builds the engine from DATABASE_URL.

[post_write_hooks]
# ruff keeps generated revisions lint-clean.
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

# WARNING, not INFO: SQLAlchemy logs the connection URL at INFO, which would print
# the database password to the migration service's stdout (§3.11).
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
