[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "moni-mcp-zoho"
version = "0.1.0"
description = "MONI AI zoho-mcp — Zoho Mail read, draft and send-with-approval tools"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    # Same pin as mcp/odoo and mcp/rag, and it is load-bearing rather than tidy: mcp 2.x renamed
    # `mcp.server.fastmcp.FastMCP` to `mcp.server.mcpserver.MCPServer`, so an unbounded `mcp>=1.0`
    # installs a version whose import fails. Written as `>=1.0` first, which built cleanly and then
    # died at `ModuleNotFoundError` inside the container — every unit test passed, because the dev
    # venv has 1.x. `tests/smoke/test_layout.py` now asserts the upper bound across all three.
    "mcp>=1.28,<2",
    "structlog>=24.4",
]

# `send_message` is the project's first `irreversible` tool — a delivered email cannot be recalled —
# and mail bodies are level-A content that also raises §3.5's untrusted flag for the whole run
# (CLAUDE.md §3.3, §3.4, §3.5). Deliberately no dependency on `moni-gateway`: the action classes are
# declared locally and `tests/unit/gateway/test_registry.py` compares them with the registry, which
# keeps LangGraph and the checkpoint stack out of this image.
