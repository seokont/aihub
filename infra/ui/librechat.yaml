# MONI AI — LibreChat configuration (task 1.4).
#
# Mounted into the UI container at /app/librechat.yaml. It lives OUTSIDE the `ui/`
# submodule on purpose: everything MONI-specific is an overlay, so `ui/` stays a pristine
# checkout of the pinned upstream tag and `git status` inside it is always clean. See
# docs/FORK_CHANGES.md.
#
# Only admin-controlled values are used here. `baseURL` in particular MUST NOT be
# "user_provided": LibreChat withholds configured header templates from user-supplied
# destinations, so a user-provided URL would silently drop the Authorization header that
# carries the user's identity (§3.2).

version: 1.3.13
cache: true

# Registration page shows only the Keycloak button. Local sign-up is disabled in the UI
# container's environment (ALLOW_REGISTRATION / ALLOW_EMAIL_LOGIN), because accounts must
# come from the corporate identity provider — an account minted in LibreChat would have no
# Keycloak subject and therefore no Odoo credentials (§3.2).
registration:
  socialLogins: ['openid']

endpoints:
  custom:
    - name: 'MONI AI'
      # The gateway is the single entry point (§3.1). Container-facing address: the UI and
      # the gateway share the compose network, and the gateway publishes no host port.
      baseURL: 'http://gateway:8080/v1'

      # `apiKey` is required by the schema but must never be the credential that reaches
      # the gateway: the Authorization header below takes precedence over it. It is only a
      # placeholder so LibreChat starts; `MONI_UPSTREAM_KEY` is not a user or Odoo secret.
      apiKey: '${MONI_UPSTREAM_KEY}'

      headers:
        # THE load-bearing line of task 1.4. LibreChat resolves this placeholder server-side
        # from the logged-in user's Keycloak access token, so the gateway receives each
        # request as that person and `claim.sub` is their real subject — never a shared
        # account (§3.2). Requires OPENID_REUSE_TOKENS=true.
        Authorization: 'Bearer {{LIBRECHAT_OPENID_ACCESS_TOKEN}}'

      models:
        # Exactly one model is offered. `fetch: false` keeps the UI from querying /v1/models
        # and rendering whatever it returns, so the list cannot drift from policy.
        default: ['moni-main']
        fetch: false

      # Chat titles are generated by a separate completion call, which would also go
      # through the gateway and consume a rate-limited agent run per conversation. The
      # gateway strips `user` and the stop sequences LibreChat sends, so dropping them here
      # is cosmetic; the important part is `current_model` (no second endpoint/provider).
      titleConvo: true
      titleModel: 'current_model'

      modelDisplayLabel: 'MONI AI'
      iconURL: '/assets/moni-logo.svg'

interface:
  # Hide the model selector: there is one model and it is a policy decision, not a user
  # choice. Users also cannot pick a different endpoint, which keeps every request on the
  # route the gateway can audit.
  modelSelect: false
  # Sampling parameters are meaningless for an agent loop that runs deterministic tool
  # steps; exposing them would invite "why did temperature not change anything?".
  parameters: false
  # The built-in Agents feature is a SEPARATE endpoint from our custom one, and it was
  # winning: `agents` is always present in LibreChat's default endpoint config, so a new
  # conversation resolved to it and the first message POSTed to /api/agents/chat with no
  # `agent_id`, failing with "agent_id is required in request body" before ever reaching the
  # gateway. Nothing in this deployment should use it — it would bypass the gateway and the
  # audit trail (§3.1, §3.8).
  agents:
    use: false
    create: false
  # No agent marketplace, no remote-agent API keys, no scheduled runs in Phase 1 — each of
  # these would reach the model without passing through the reviewed chat route.
  marketplace:
    use: false
  remoteAgents:
    use: false
    create: false
  # Shared links are plausible later; off now so the Phase 1 UI has one way to hold a
  # conversation and the audit trail stays complete.
  sharedLinks:
    create: false
    share: false
    public: false

# --- The default model, and the only one --------------------------------------
#
# Without this, LibreChat picks a default endpoint itself and `agents` wins (see the comment
# above). A model spec is LibreChat's supported way to pin the choice:
#
#   * `enforce: true` makes the spec override other selection settings, so a new conversation
#     always starts on it and a user cannot switch away;
#   * `default: true` makes it the auto-selected spec for every new chat (not just a
#     first-run `softDefault`, which a user's later choice would override);
#   * `preset.endpoint` must equal the custom endpoint's `name` EXACTLY — 'MONI AI', not a
#     slug — or the spec resolves to nothing and the default endpoint comes back.
#
# `preset.model` is REQUIRED, and omitting it fails at request time rather than at startup:
# the ephemeral agent the chat runtime builds raised
# `{"type":"missing_model","info":"MONI AI"}` — it names the ENDPOINT it could not find a
# model for. The endpoint alone is not enough; the spec must also say which model to run.
# The value must match an entry in the custom endpoint's `models.default` above, which is
# where the endpoint's model list comes from (this deployment uses `fetch: false`).
modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: 'moni-ai'
      label: 'MONI AI'
      description: 'MONI AI operations assistant — reads live Odoo data through the gateway.'
      default: true
      iconURL: '/assets/moni-logo.svg'
      preset:
        endpoint: 'MONI AI'
        model: 'moni-main'
