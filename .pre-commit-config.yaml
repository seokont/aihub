# Pre-commit — the same two tools CI runs, so local and CI cannot disagree.
#
# Install once:  uv tool install pre-commit && pre-commit install
# Run on demand: pre-commit run --all-files
#
# The hooks use `uv run --group dev`, i.e. the versions pinned in pyproject.toml, not
# whatever happens to be on PATH.

default_language_version:
  python: python3.12

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        description: lint (line length 100, isort, bandit-style security rules)
        entry: uv run --group dev ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        description: formatting
        entry: uv run --group dev ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy --strict
        description: types for the gateway and the tests that exercise it
        entry: uv run --group dev mypy gateway/src tests infra/keycloak scripts
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

      # Cheap guards for the two rules that are easy to break silently (§3.1, §3.11).
      - id: environment-audit
        name: environment audit (loopback ports, .env.example, secrets)
        entry: uv run --group dev python scripts/check_environment.py
        language: system
        pass_filenames: false
        files: ^(\.env\.example|infra/.*\.ya?ml|scripts/check_environment\.py)$

      - id: no-env-committed
        name: no .env committed
        description: secrets live only in the environment (§3.11)
        entry: bash -c 'for f in "$@"; do case "$f" in *.example) ;; *) echo "refusing to commit $f"; exit 1;; esac; done' --
        language: system
        files: (^|/)\.env
