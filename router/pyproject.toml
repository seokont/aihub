[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "moni-router"
version = "0.1.0"
description = "MONI AI LLM Router — A/B/C routing, anonymizer, local and cloud providers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
]

